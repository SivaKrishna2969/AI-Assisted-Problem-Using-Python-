<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character set and viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page Title -->
    <title>Student Info Portal</title>

    <!-- Internal CSS for styling -->
    <style>
        /* Basic body reset and font styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Header styling */
        header {
            background-color: #4CAF50; /* Green background */
            color: white;
            padding: 1rem 0;
            text-align: center;
        }

        /* Navigation bar styling */
        nav {
            background-color: #333;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex; /* Use flexbox for horizontal layout */
            justify-content: center; /* Center items horizontally */
            flex-wrap: wrap; /* Allow items to wrap on smaller screens */
        }

        nav ul li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        nav ul li a:hover {
            background-color: #111;
        }

        /* Main content section - Centered */
        main {
            max-width: 800px; /* Limits the width of the content */
            margin: 20px auto; /* Top/bottom margin 20px, left/right auto for centering */
            padding: 20px;
            background-color: white;
            border-radius: 8px;
        }

        /* Footer styling */
        footer {
            background-color: #f2f2f2; /* Light gray background */
            text-align: center;
            padding: 1rem 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }

        /* Responsive design for navigation bar */
        @media (max-width: 600px) {
            nav ul {
                flex-direction: column; /* Stack nav items vertically */
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Student Info Portal</h1>
    </header>

    <!-- Navigation Menu -->
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#courses">Courses</a></li>
            <li><a href="#grades">Grades</a></li>
            <li><a href="#profile">Profile</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Main Content Section -->
    <main>
        <h2>Welcome!</h2>
        <p>
            This is the main content area. You can find your student information
            by using the navigation menu above.
        </p>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2023 Student Info Portal. All Rights Reserved.</p>
    </footer>

</body>
</html>
